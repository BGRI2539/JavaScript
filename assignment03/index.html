<!DOCTYPE html>

<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Order Form</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Link to external JS with defer -->
  <script src="js/order.js" defer></script>

</head>

<body>

  <header>
    <h1>Order Your Pizza!</h1>
    <!-- Student info will be added dynamically via JavaScript -->
    <p id="student-info"></p>
  </header>

  <main>
    <!-- Pizza order form -->
    <form id="pizza-form">
      <!-- Pizza Size Selection -->
      <div class="form-group">
        <label for="size">Select Size:</label>
        <select id="size" name="size" required>
          <option value="">--Choose a size--</option>
          <option value="Small">Small</option>
          <option value="Medium">Medium</option>
          <option value="Large">Large</option>
          <option value="Xtra-Large">Xtra-Large</option>
        </select>
      </div>

      <!-- Crust Type Selection -->
      <div class="form-group">
        <label for="crust">Crust Type:</label>
        <select id="crust" name="crust" required>
          <option value="">--Choose crust--</option>
          <option value="Thin">Thin</option>
          <option value="Thick">Thick</option>
          <option value="Stuffed">Stuffed</option>
        </select>
      </div>

      <!-- Toppings Checkboxes -->
      <div class="form-group">
        <p>Select Toppings:</p>
        <label><input type="checkbox" name="toppings" value="Pepperoni"> Pepperoni</label>
        <label><input type="checkbox" name="toppings" value="Mushrooms"> Mushrooms</label>
        <label><input type="checkbox" name="toppings" value="Onions"> Onions</label>
        <label><input type="checkbox" name="toppings" value="Sausage"> Sausage</label>
        <label><input type="checkbox" name="toppings" value="Bacon"> Bacon</label>
        <label><input type="checkbox" name="toppings" value="Extra Cheese"> Extra Cheese</label>
        <label><input type="checkbox" name="toppings" value="Black Olives"> Black Olives</label>
      </div>

      <!-- Additional Instructions -->
      <div class="form-group">
        <label for="instructions">Additional Instructions:</label>
        <textarea id="instructions" name="instructions" rows="4" placeholder="Enter any special instructions..."></textarea>
      </div>

      <!-- Order Button -->
      <button type="submit" id="order-button">Order</button>
    </form>

    <!-- Section to display the order summary -->
    <section id="order-summary"></section>

  </main>

  <footer>
    <p>&copy; 2025 Pizza Ordering Application</p>
  </footer>

</body>

</html>
