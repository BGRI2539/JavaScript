<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Information Demo</title>
  <!-- Link to the CSS file -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Defer the JavaScript file so it runs after HTML is parsed -->
  <script defer src="js/script.js"></script>
</head>
<body>
  <header>
    <h1>Weather Information</h1>
  </header>
  
  <!-- Student Information will be inserted here -->
  <p id="student-info"></p>
  
  <!-- Section to display API data -->
  <section id="weather-data">
    <h2>Current Weather in Orillia</h2>
    <div id="weather-output">
      <!-- Weather data from the API will appear here -->
    </div>
  </section>
  
  <!-- Link to the documentation for academic integrity -->
  <footer>
    <p>
      API Documentation:
      <a href="https://openweathermap.org/current" target="_blank">
        OpenWeatherMap API
      </a>
    </p>
  </footer>
</body>
</html>
